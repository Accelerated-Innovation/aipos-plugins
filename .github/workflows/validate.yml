name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads code and runs local validation.
permissions:
  contents: read

jobs:
  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      # Actions and the CLI are pinned to exact versions so this gate stays
      # deterministic. Bump the SHA/version and its comment together.
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.199

      # Structural validation of marketplace.json and plugin manifests.
      # No API key required — this does not call the model.
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          claude plugin validate plugins/aipos

  checks:
    name: pytest (skill scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Pinned in requirements-dev.txt so the gate stays reproducible.
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      # Behaviour and semantic-preservation tests for the bundled skill scripts:
      # Gherkin ingestion fidelity and the map renderer. Deterministic, offline, and
      # needs no API key — these assert what the tools do, not how any skill is worded.
      - name: Run deterministic checks
        run: python -m pytest tests -q

  viewer:
    name: journey viewer (vitest + bundle freshness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewers/journey
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewers/journey/package-lock.json

      # Pinned by package-lock.json, so the rebuild below is reproducible.
      - name: Install viewer dependencies
        run: npm ci

      # The viewer's own logic: levels, scope and highlighting. Facts about the
      # graph are tested in pytest, where journey_graph.py computes them.
      - name: Run viewer tests
        run: npm test

      # The bundle in aipos-map-render/scripts/assets is what ships. Rebuild it
      # and fail if the committed copy is not what this source produces.
      - name: Check the committed bundle is current
        run: npm run check-bundle
